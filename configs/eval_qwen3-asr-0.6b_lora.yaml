# Usage: python -m cyasr.run_baseline --config configs/eval_qwen3-asr-0.6b_lora.yaml
run_name: qwen3-asr-0.6b_lora
backend: qwen3_asr
model: /content/drive/MyDrive/cyasr/runs/finetune_qwen3-asr-0.6b_lora/best   # Colab path; elsewhere pass --model <folder>
